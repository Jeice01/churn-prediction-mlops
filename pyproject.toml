[project]
name = "churn-prediction-mlops"
version = "0.1.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "fastapi>=0.143.0",
    "mlflow>=3.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

